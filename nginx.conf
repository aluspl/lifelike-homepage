# Minimalny zamiennik domyslnego server-blocka nginx:alpine.
# Jedyna roznica wobec domyslnego: absolute_redirect off.
#
# Po co: wejscie na /valheim (bez ukosnika) domyslnie konczy sie
# przekierowaniem bezwzglednym, ktore nginx sklada z Host + schemat "http",
# bo zza tunelu cloudflared nie widzi oryginalnego https. Uzytkownik dostawal
# 301 z https na http i dodatkowy skok przez Cloudflare. Wzgledne
# przekierowanie ("/valheim/") zachowuje schemat, ktorym przyszedl klient.
server {
    listen 80;
    server_name _;

    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # =404 zamiast fallbacku na index.html - strona nie ma routera,
    # wiec nieznana sciezka ma byc 404, a nie cicho serwowana aplikacja.
    location / {
        try_files $uri $uri/ =404;
    }
}
